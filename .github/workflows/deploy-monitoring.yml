
name: Deploy Monitoring Stack

on:
  push:
    branches:
      - main
    paths:
      - "monitoring/**"
      - "k8s/service.yaml"
      - ".github/workflows/deploy-monitoring.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy-monitoring:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    env:
      PROJECT_ID: heart-risk-mlops
      GKE_CLUSTER: heart-disease-cluster
      GKE_LOCATION: asia-south1

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required configuration
        env:
          GCP_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail

          test -n "$GCP_PROVIDER" || {
            echo "Missing repository variable GCP_WORKLOAD_IDENTITY_PROVIDER"
            exit 1
          }

          test -n "$GCP_SERVICE_ACCOUNT" || {
            echo "Missing repository variable GCP_SERVICE_ACCOUNT"
            exit 1
          }

          test -n "$GRAFANA_ADMIN_PASSWORD" || {
            echo "Add GRAFANA_ADMIN_PASSWORD as a GitHub Actions secret."
            exit 1
          }

          python -m json.tool \
            monitoring/grafana/dashboards/heart-disease-api.json \
            > /dev/null

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: ${{ env.GKE_CLUSTER }}
          location: ${{ env.GKE_LOCATION }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Validate and apply API Service
        run: |
          set -euo pipefail
          kubectl apply --dry-run=server -f k8s/service.yaml
          kubectl apply -f k8s/service.yaml

      - name: Configure Grafana administrator secret
        env:
          GRAFANA_ADMIN_PASSWORD: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail

          kubectl create namespace monitoring \
            --dry-run=client -o yaml | kubectl apply -f -

          kubectl create secret generic grafana-admin \
            --namespace monitoring \
            --from-literal=admin-user=admin \
            --from-literal=admin-password="$GRAFANA_ADMIN_PASSWORD" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Add Helm repositories
        run: |
          set -euo pipefail
          helm repo add prometheus-community \
            https://prometheus-community.github.io/helm-charts
          helm repo add grafana https://grafana.github.io/helm-charts
          helm repo update

      - name: Install or upgrade Prometheus
        run: |
          set -euo pipefail
          helm upgrade --install prometheus \
            prometheus-community/prometheus \
            --namespace monitoring \
            --create-namespace \
            --values monitoring/prometheus/values.yaml \
            --wait \
            --timeout 10m

      - name: Install or upgrade Grafana
        run: |
          set -euo pipefail
          helm upgrade --install grafana \
            grafana/grafana \
            --namespace monitoring \
            --values monitoring/grafana/values.yaml \
            --wait \
            --timeout 10m

      - name: Publish dashboard ConfigMap
        run: |
          set -euo pipefail

          kubectl create configmap heart-disease-api-dashboard \
            --namespace monitoring \
            --from-file=heart-disease-api.json=monitoring/grafana/dashboards/heart-disease-api.json \
            --dry-run=client -o yaml \
          | kubectl label --local -f - grafana_dashboard=1 -o yaml \
          | kubectl apply -f -

      - name: Verify monitoring deployment
        run: |
          set -euo pipefail

          kubectl rollout status deployment/prometheus-server \
            --namespace monitoring --timeout=5m

          kubectl rollout status deployment/grafana \
            --namespace monitoring --timeout=5m

          kubectl get pods,services -n monitoring
          kubectl get configmap heart-disease-api-dashboard \
            -n monitoring
