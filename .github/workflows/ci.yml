
name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e . --no-deps

      - name: Lint
        run: ruff check .

      - name: Security static analysis
        run: bandit -q -r src

      - name: Dependency vulnerability audit
        run: pip-audit -r requirements.txt

      - name: Tests and coverage
        run: |
          pytest --cov=heart_ml \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Download and prepare dataset
        run: python -m heart_ml.data

      - name: Train models and track experiments
        run: |
          python -m heart_ml.train \
            --data data/raw/heart_disease.csv \
            --output models/model.joblib \
            --mlflow \
            --quick

      - name: Verify trained model
        run: |
          test -s models/model.joblib || {
            echo "ERROR: models/model.joblib was not generated."
            exit 1
          }

      - name: Upload training artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: heart-disease-training-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            models/
            reports/training/
            mlruns/

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: Build Docker image
        run: docker build -t heart-disease-mlops:test .

      - name: Start Docker container
        run: |
          docker run -d \
            --name heart-disease-mlops \
            -p 8000:8000 \
            heart-disease-mlops:test

      - name: Test container health
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://localhost:8000/health; then
              echo "Health endpoint is responding."
              exit 0
            fi
            sleep 2
          done

          echo "Container health check failed. Container logs:"
          docker logs heart-disease-mlops
          exit 1

      - name: Stop Docker container
        if: always()
        run: docker rm -f heart-disease-mlops || true
